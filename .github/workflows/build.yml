name: Build local practice app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: windows-x64
          - os: macos-15
            package: macos-arm64
          - os: macos-15-intel
            package: macos-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install 'pyinstaller==6.22.3'
      - name: Install participant dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir --target .ci-deps -r agent/requirements.txt
      - name: Build native app
        run: python scripts/build.py
      - name: Run declared complete-project entry
        run: python scripts/smoke_project.py
      - name: Run complete-project entry with installed participant dependencies
        env:
          MODEL_PROVIDER: deterministic
          PYTHONPATH: ${{ github.workspace }}/.ci-deps
          SMOKE_INHERIT_ENV: '1'
        run: python scripts/smoke_project.py
      - name: Run participant JSONL v2 contract smoke
        run: python scripts/smoke_protocol.py
      - name: Run both public scenarios inside packaged app
        run: python scripts/smoke_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: GOSIMPractice-${{ matrix.package }}
          path: dist/GOSIMPractice-*.zip
          if-no-files-found: error
      - name: Upload standalone Windows executable
        if: matrix.package == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: GOSIMPractice-Windows-exe
          path: dist/GOSIMPractice.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GOSIMPractice-*
          merge-multiple: true
          path: release-assets
      - name: Write release checksums
        shell: bash
        run: cd release-assets && sha256sum GOSIMPractice-*.zip GOSIMPractice.exe > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/GOSIMPractice.exe release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
